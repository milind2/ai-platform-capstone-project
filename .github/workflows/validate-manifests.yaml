name: Validate Kubernetes Manifests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate vLLM manifest
        run: kubeconform -summary vllm/deployment.yaml

      - name: Validate Triton manifest
        run: kubeconform -summary triton/deployment.yaml

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: vllm/Dockerfile
          failure-threshold: error
# Note: failure-threshold set to 'error' rather than 'warning'. DL3008 (pin apt
# package versions) is intentionally not enforced here — Ubuntu base-image apt
# versions shift over time and pinning exact versions for OS-level tooling
# packages (python3, git) trades reproducibility for frequent, low-value
# maintenance churn. The vllm pip package IS pinned (see Dockerfile), since
# that's the dependency that actually matters for reproducible builds.
